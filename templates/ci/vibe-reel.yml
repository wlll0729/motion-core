# vibe-reel 技能 CI 模板
#
# 用法：把本文件复制成 vibe-reel 仓库的 .github/workflows/ci.yml。
#
# 它跑技能自带的三道门禁：doctor（环境）→ selftest（3 秒自检片 + 确定性）
# → 集成验证（RK.core / E.byName + 与噪声对比的像素回归）。
#
# 需要工程目录里有一条片子（默认 examples/demo-qubit）用于渲染回归。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    name: 自检（确定性 + 字体 + 亮度）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium
      - name: doctor
        run: python kr.py doctor
      - name: selftest
        run: python kr.py selftest

  integration:
    name: motion-core 集成（E.byName + 像素回归）
    runs-on: ubuntu-latest
    needs: selftest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow numpy
          python -m playwright install chromium
      - name: 跑集成验证
        run: |
          git clone --depth 1 https://github.com/<你的账号>/motion-core.git /tmp/motion-core
          python /tmp/motion-core/scripts/verify-vibe-reel-integration.py examples/demo-qubit
